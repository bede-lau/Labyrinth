[project]
name = "labyrinth_main"
version = "0.1.0"
description = "Labyrinth backend ('main' process): data preparation, verification, live GX orchestration."
requires-python = ">=3.11"
dependencies = ["numpy==2.5.3", "h5py==3.16.0", "netCDF4==1.7.5.1.post1", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
live = ["modal==1.6.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
